<svg width="100%" viewBox="220 60 240 240" role="img" xmlns="http://www.w3.org/2000/svg" style="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">BearBless app icon, bear-touched</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An Apple-style squircle app icon with a violet gradient background and a soft white ghost-bear glyph, featuring two small ears, a tiny nose and smile, and eyes split into one solid and one faintly dashed.</desc>
<defs>
<clipPath id="iconClip4"><rect x="240" y="80" width="200" height="200" rx="44"/></clipPath>
<linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#8B7CFF"/>
<stop offset="1" stop-color="#4B3FCC"/>
</linearGradient>
<linearGradient id="glossGrad2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<style>
  .bear-character {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: bearBreathe 4.8s ease-in-out infinite;
  }
  .bear-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: bearBlink 5.6s ease-in-out infinite;
  }
  .bear-eye-right { animation-delay: .04s; }
  @keyframes bearBreathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-1.2px) scaleY(1.012); }
  }
  @keyframes bearBlink {
    0%, 43%, 47%, 82%, 86%, 100% { transform: scaleY(1); }
    45%, 84% { transform: scaleY(.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bear-character, .bear-eye { animation: none; }
  }
</style>
</defs>

<rect x="240" y="80" width="200" height="200" rx="44" fill="url(#bgGrad2)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

